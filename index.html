<!DOCTYPE html>
<!-- noam-archive-generated v4 -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ארכיון ההודעות</title>
<style>
:root{--bg:#e9e2d8;--panel:#fffdf8;--bubble:#ffffff;--ink:#1f2421;
--muted:#6b7280;--accent:#2f6d4f;--line:#d9d2c6;}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--panel:#161d24;
--bubble:#1e2831;--ink:#e8edf2;--muted:#94a3b8;--accent:#5fbf8f;--line:#2b3742;}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
font-family:"Segoe UI",Arial,sans-serif;}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;
padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
header h1{margin:0;font-size:18px;font-weight:600;}
header .sub{font-size:12px;opacity:.85;margin-top:2px;}
#search{width:100%;box-sizing:border-box;margin-top:10px;padding:8px 10px;
border:0;border-radius:8px;font-size:14px;font-family:inherit;}
main{max-width:780px;margin:0 auto;padding:16px;}
.day{text-align:center;margin:18px 0 10px;}
.day span{background:var(--panel);border:1px solid var(--line);color:var(--muted);
border-radius:999px;padding:4px 12px;font-size:12px;}
.msg{background:var(--bubble);border:1px solid var(--line);border-radius:12px;
padding:10px 12px;margin:8px 0;box-shadow:0 1px 2px rgba(0,0,0,.05);}
.who{font-weight:600;color:var(--accent);font-size:13px;margin-bottom:4px;}
.txt{white-space:pre-wrap;word-wrap:break-word;line-height:1.55;font-size:15px;}
.when{text-align:left;color:var(--muted);font-size:11px;margin-top:6px;}
.files{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;}
.files img{max-width:100%;border-radius:8px;display:block;}
.file{display:inline-block;background:var(--panel);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font-size:13px;text-decoration:none;color:var(--ink);}
.file.dead{opacity:.6;}
.embed{flex:1 1 100%;}
.embed iframe{width:100%;aspect-ratio:16/10;border:1px solid var(--line);
border-radius:8px;background:#000;display:block;}
.txt a.lnk{color:var(--accent);word-break:break-all;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
#navbtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;
font-size:18px;line-height:1;padding:7px 10px;cursor:pointer;}
#navwrap{position:fixed;inset:0;z-index:20;display:none;}
#navwrap.open{display:block;}
#navback{position:absolute;inset:0;background:rgba(0,0,0,.45);}
#nav{position:absolute;top:0;bottom:0;right:0;width:min(290px,82vw);
background:var(--panel);overflow-y:auto;padding:14px 12px;}
#nav h2{margin:0 0 12px;font-size:15px;color:var(--accent);}
.nav-mo{margin-bottom:12px;}
.nav-mo-btn{width:100%;text-align:right;background:transparent;color:var(--ink);
border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;
font-family:inherit;cursor:pointer;font-weight:600;}
.nav-days{list-style:none;margin:6px 0 0;padding:0;}
.nav-day{width:100%;background:transparent;color:var(--ink);border:0;
border-radius:6px;padding:6px 10px;font-size:14px;font-family:inherit;
cursor:pointer;display:flex;justify-content:space-between;gap:8px;}
.nav-day:hover{background:var(--bubble);}
.nav-n{color:var(--muted);font-size:12px;}
@media (min-width:900px){#navbtn{display:none;}
 #navwrap{display:block;position:static;}#navback{display:none;}
 #nav{position:fixed;top:0;bottom:0;right:0;width:260px;
 border-left:1px solid var(--line);}
 body{padding-right:260px;}}
#more{display:block;width:100%;margin:20px 0 40px;padding:12px;font-size:15px;
font-family:inherit;background:var(--panel);color:var(--ink);
border:1px solid var(--line);border-radius:10px;cursor:pointer;}
#status{text-align:center;color:var(--muted);padding:20px;font-size:14px;}
</style>
</head>
<body>
<header>
<div class="hdr-row"><h1>ארכיון ההודעות</h1>
<button id="navbtn" title="תאריכים" aria-label="תאריכים">&#128197;</button></div>
<div class="sub" id="sub">טוען…</div>
<input id="search" type="search" placeholder="חיפוש בהודעות…">
</header>
<div id="navwrap"><div id="navback"></div>
<div id="nav"><h2>קפיצה לתאריך</h2><div id="navlist"></div></div></div>
<main><div id="feed"></div>
<button id="more" hidden>טען הודעות ישנות יותר</button>
<div id="status">טוען…</div></main>
<script>
var months=[],loaded=[],all=[],filter="";
var feed=document.getElementById("feed"),more=document.getElementById("more");
var statusEl=document.getElementById("status"),sub=document.getElementById("sub");
var navWrap=document.getElementById("navwrap");
var navList=document.getElementById("navlist");
var firstRender=true;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function isImage(f){return /^image\//.test(f.type||"");}
function linkify(t){return t.replace(/(https?:\/\/[^\s<"]+)/g,function(u){
 var c=u.replace(/[.,;:!?)\]]+$/,""),tail=u.slice(c.length);
 return '<a class="lnk" href="'+c+'" target="_blank" rel="noopener noreferrer">'+c+"</a>"+tail;});}
function driveId(u){var m=/\/file\/d\/([A-Za-z0-9_-]+)/.exec(u||"");return m?m[1]:"";}
function fileHtml(f){
 if(!f.path&&f.url)return driveHtml({name:f.name,size:f.size,url:f.url});
 if(!f.path)return '<span class="file dead">'+esc(f.name)+" — "+esc(f.skipped||"")+"</span>";
 if(isImage(f))return '<a href="'+encodeURI(f.path)+'" target="_blank">'+
  '<img loading="lazy" src="'+encodeURI(f.path)+'" alt="'+esc(f.name)+'"></a>';
 return '<a class="file" href="'+encodeURI(f.path)+'" target="_blank">'+
  esc(f.name)+" ("+esc(f.size)+")</a>";}
function driveHtml(d){var id=driveId(d.url);
 var cap=esc(d.name)+(d.size?" ("+esc(d.size)+")":"");
 if(!id)return '<a class="file" href="'+encodeURI(d.url)+'" target="_blank">'+cap+"</a>";
 return '<div class="embed"><iframe loading="lazy" allow="autoplay" '+
  'src="https://drive.google.com/file/d/'+id+'/preview"></iframe>'+
  '<a class="file" href="'+encodeURI(d.url)+'" target="_blank">'+cap+" — פתיחה בדרייב</a></div>";}
function render(){
 var list=all.slice();
 if(filter){var q=filter.toLowerCase();list=list.filter(function(m){
  return (m.text||"").toLowerCase().indexOf(q)>-1||
   (m.sender||"").toLowerCase().indexOf(q)>-1;});}
 list.sort(function(a,b){return a.ts-b.ts;});
 var html="",lastDay="";
 list.forEach(function(m){
  if(m.date!==lastDay){lastDay=m.date;
   html+='<div class="day"><span>'+esc(m.date)+"</span></div>";}
  html+='<div class="msg"><div class="who">'+esc(m.sender)+"</div>";
  if(m.text)html+='<div class="txt">'+linkify(esc(m.text))+"</div>";
  var f=(m.files||[]).map(fileHtml);
  if(m.drive&&m.drive.url)f.push(driveHtml(m.drive));
  if(f.length)html+='<div class="files">'+f.join("")+"</div>";
  html+='<div class="when">'+esc(m.time)+"</div></div>";});
 feed.innerHTML=html;
 [].forEach.call(feed.querySelectorAll(".day"),function(el){
  el.id="d-"+el.textContent.trim();});
 statusEl.textContent=list.length?"":(filter?"אין תוצאות.":"אין עדיין הודעות.");
 sub.textContent=all.length+" הודעות · "+loaded.length+" מתוך "+months.length+" חודשים";
 more.hidden=loaded.length>=months.length;
 buildNav();
 if(firstRender&&!filter&&list.length){firstRender=false;
  setTimeout(function(){
   window.scrollTo(0,document.documentElement.scrollHeight);},60);}}
function buildNav(){
 var byDate={};
 all.forEach(function(m){byDate[m.date]=(byDate[m.date]||0)+1;});
 navList.innerHTML="";
 months.slice().sort().reverse().forEach(function(mo){
  var box=document.createElement("div");box.className="nav-mo";
  var b=document.createElement("button");b.className="nav-mo-btn";
  b.setAttribute("data-mo",mo);
  b.textContent=loaded.indexOf(mo)>-1?mo:mo+" — לחצו לטעינה";
  box.appendChild(b);
  var days=Object.keys(byDate).filter(function(d){return d.indexOf(mo)===0;})
   .sort().reverse();
  if(days.length){
   var ul=document.createElement("ul");ul.className="nav-days";
   days.forEach(function(d){
    var li=document.createElement("li");
    var db=document.createElement("button");db.className="nav-day";
    db.setAttribute("data-d",d);
    var s1=document.createElement("span");
    s1.textContent=d.slice(8)+"."+d.slice(5,7);
    var s2=document.createElement("span");s2.className="nav-n";
    s2.textContent=byDate[d];
    db.appendChild(s1);db.appendChild(s2);li.appendChild(db);ul.appendChild(li);});
   box.appendChild(ul);}
  navList.appendChild(box);});}
function toggleNav(on){
 var show=(on===undefined)?!navWrap.classList.contains("open"):on;
 if(show)navWrap.classList.add("open");else navWrap.classList.remove("open");}
document.getElementById("navbtn").addEventListener("click",function(){toggleNav();});
document.getElementById("navback").addEventListener("click",function(){toggleNav(false);});
navList.addEventListener("click",function(e){
 var t=e.target;
 var mb=t.closest?t.closest(".nav-mo-btn"):null;
 if(mb){var k=mb.getAttribute("data-mo");
  if(loaded.indexOf(k)<0){mb.disabled=true;loadOlder(k);}
  return;}
 var db=t.closest?t.closest(".nav-day"):null;
 if(db){var el=document.getElementById("d-"+db.getAttribute("data-d"));
  if(el){toggleNav(false);
   var hh=document.querySelector("header").offsetHeight+8;
   var y=el.getBoundingClientRect().top+window.pageYOffset-hh;
   window.scrollTo({top:y<0?0:y,behavior:"smooth"});}}});
function loadOlder(mo,done){
 var h0=document.documentElement.scrollHeight,y0=window.pageYOffset;
 loadMonth(mo).then(function(){render();
  var h1=document.documentElement.scrollHeight;
  window.scrollTo(0,y0+(h1-h0));
  if(done)done();});}
function loadMonth(m){return fetch("data/"+m+".json?t="+Date.now())
 .then(function(r){return r.ok?r.json():{messages:[]};})
 .then(function(d){all=all.concat(d.messages||[]);loaded.push(m);});}
document.getElementById("search").addEventListener("input",function(e){
 filter=e.target.value.trim();render();});
more.addEventListener("click",function(){
 var next=months[months.length-1-loaded.length];
 if(!next)return;more.disabled=true;
 loadOlder(next,function(){more.disabled=false;});});
fetch("data/index.json?t="+Date.now()).then(function(r){
 if(!r.ok)throw new Error("אין עדיין נתונים");return r.json();})
 .then(function(d){months=(d.months||[]).sort();
  if(!months.length){statusEl.textContent="אין עדיין הודעות.";return;}
  return loadMonth(months[months.length-1]).then(render);})
 .catch(function(){statusEl.textContent="הארכיון עדיין ריק. אחרי ההרצה הראשונה ההודעות יופיעו כאן.";});
</script>
</body>
</html>
