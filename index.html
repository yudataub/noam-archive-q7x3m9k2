<!DOCTYPE html>
<!-- noam-archive-generated v12 -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ארכיון ההודעות</title>
<style>
:root{--bg:#e9e2d8;--panel:#fffdf8;--bubble:#ffffff;--ink:#1f2421;
--star:#d99a06;
--muted:#6b7280;--accent:#2f6d4f;--line:#d9d2c6;}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--panel:#161d24;
--bubble:#1e2831;--ink:#e8edf2;--muted:#94a3b8;--accent:#5fbf8f;--line:#2b3742;
--star:#f0c23c;}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
font-family:"Segoe UI",Arial,sans-serif;}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;
padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
header h1{margin:0;font-size:18px;font-weight:600;}
header .sub{font-size:12px;opacity:.85;margin-top:2px;}
#search{width:100%;box-sizing:border-box;margin-top:10px;padding:8px 10px;
border:0;border-radius:8px;font-size:14px;font-family:inherit;}
#sender{width:100%;box-sizing:border-box;margin-top:8px;padding:8px 10px;
border:0;border-radius:8px;font-size:14px;font-family:inherit;
background:#fff;color:#1f2421;}
main{max-width:780px;margin:0 auto;padding:16px;}
.day{text-align:center;margin:18px 0 10px;}
.day span{background:var(--panel);border:1px solid var(--line);color:var(--muted);
border-radius:999px;padding:4px 12px;font-size:12px;}
.msg{background:var(--bubble);border:1px solid var(--line);border-radius:12px;
padding:10px 12px;margin:8px 0;box-shadow:0 1px 2px rgba(0,0,0,.05);}
.who{font-weight:600;color:var(--accent);font-size:13px;margin-bottom:4px;}
.txt{white-space:pre-wrap;word-wrap:break-word;line-height:1.55;font-size:15px;}
.when{text-align:left;color:var(--muted);font-size:11px;margin-top:6px;}
.files{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;}
.files img{max-width:100%;border-radius:8px;display:block;}
.file{display:inline-block;background:var(--panel);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font-size:13px;text-decoration:none;color:var(--ink);}
.file.dead{opacity:.6;}
.embed{flex:1 1 100%;}
.embed img{width:100%;border-radius:8px;display:block;}
.embed iframe{width:100%;aspect-ratio:16/10;border:1px solid var(--line);
border-radius:8px;background:#000;display:block;}
.embed video{width:100%;max-height:70vh;border-radius:8px;background:#000;display:block;}
.vload{width:100%;aspect-ratio:16/9;max-height:50vh;border:0;border-radius:8px;
background:#111;color:#fff;font:inherit;font-size:16px;cursor:pointer;display:block;}
.txt a.lnk{color:var(--accent);word-break:break-all;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
#navbtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;
font-size:18px;line-height:1;padding:7px 10px;cursor:pointer;}
#navwrap{position:fixed;inset:0;z-index:20;display:none;}
#navwrap.open{display:block;}
#navback{position:absolute;inset:0;background:rgba(0,0,0,.45);}
#nav{position:absolute;top:0;bottom:0;right:0;width:min(290px,82vw);
background:var(--panel);overflow-y:auto;padding:14px 12px;}
#nav h2{margin:0 0 12px;font-size:15px;color:var(--accent);}
.nav-mo{margin-bottom:12px;}
.nav-mo-btn{width:100%;text-align:right;background:transparent;color:var(--ink);
border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;
font-family:inherit;cursor:pointer;font-weight:600;}
.nav-days{list-style:none;margin:6px 0 0;padding:0;}
.nav-day{width:100%;background:transparent;color:var(--ink);border:0;
border-radius:6px;padding:6px 10px;font-size:14px;font-family:inherit;
cursor:pointer;display:flex;justify-content:space-between;gap:8px;}
.nav-day:hover{background:var(--bubble);}
.nav-n{color:var(--muted);font-size:12px;}
@media (min-width:900px){#navbtn{display:none;}
 #navwrap{display:block;position:static;}#navback{display:none;}
 #nav{position:fixed;top:0;bottom:0;right:0;width:260px;
 border-left:1px solid var(--line);}
 body{padding-right:260px;}}
#more{display:block;width:100%;margin:20px 0 40px;padding:12px;font-size:15px;
font-family:inherit;background:var(--panel);color:var(--ink);
border:1px solid var(--line);border-radius:10px;cursor:pointer;}
.star{background:none;border:0;color:var(--muted);cursor:pointer;
font-size:15px;line-height:1;padding:2px 4px;opacity:.3;margin-inline-start:6px;}
.star:hover{opacity:1;}
.msg:hover .star{opacity:.7;}
.msg.starred{border-color:var(--star);box-shadow:0 0 0 1px var(--star) inset;}
.star.on,.msg.starred .star{opacity:1;color:var(--star);}
#onlystar{margin-top:8px;width:100%;box-sizing:border-box;padding:7px 10px;
border:0;border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer;
background:rgba(255,255,255,.18);color:#fff;}
#onlystar.on{background:var(--star);color:#1f2421;font-weight:600;}
.del{background:none;border:0;color:var(--muted);cursor:pointer;
font-size:13px;line-height:1;padding:2px 4px;opacity:.35;margin-inline-start:6px;}
.del:hover{opacity:1;color:#c0392b;}
.msg:hover .del{opacity:.75;}
mark.hit{background:#ffe066;color:#1f2421;font-weight:700;border-radius:3px;padding:0 1px;}
#status{text-align:center;color:var(--muted);padding:20px;font-size:14px;}
</style>
</head>
<body>
<header>
<div class="hdr-row"><h1>ארכיון ההודעות</h1>
<button id="navbtn" title="תאריכים" aria-label="תאריכים">&#128197;</button></div>
<div class="sub" id="sub">טוען…</div>
<input id="search" type="search" placeholder="חיפוש בהודעות…">
<select id="sender" aria-label="סינון לפי שולח">
<option value="">כל השולחים</option></select>
<button id="onlystar" type="button">☆ מסומנות (0)</button>
</header>
<div id="navwrap"><div id="navback"></div>
<div id="nav"><h2>קפיצה לתאריך</h2><div id="navlist"></div></div></div>
<main><div id="feed"></div>
<button id="more" hidden>טען הודעות ישנות יותר</button>
<div id="status">טוען…</div></main>
<script>
var DELURL="https://script.google.com/macros/s/AKfycbywxKrMfM1pMURY56tO8uO7umcvNAzLM4hzdYx0SggivXVhpozyz0D6YttNFHkwRfQl/exec";
var months=[],loaded=[],all=[],filter="",senderFilter="";
var starFilter=false,stars={};
try{stars=JSON.parse(localStorage.getItem("noam_stars")||"{}")||{};}
catch(e){stars={};}
function saveStars(){try{
 localStorage.setItem("noam_stars",JSON.stringify(stars));}catch(e){}}
var feed=document.getElementById("feed"),more=document.getElementById("more");
var statusEl=document.getElementById("status"),sub=document.getElementById("sub");
var senderSel=document.getElementById("sender");
var starBtn=document.getElementById("onlystar");
var navWrap=document.getElementById("navwrap");
var navList=document.getElementById("navlist");
var firstRender=true;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function isImage(f){return /^image\//.test(f.type||"");}
function isVideo(f){return /^video\//.test(f.type||"")||
 /[.](mp4|m4v|mov|webm|3gp)$/i.test(f.name||"");}
function linkify(t){return t.replace(/(https?:\/\/[^\s<"]+)/g,function(u){
 var c=u.replace(/[.,;:!?)\]]+$/,""),tail=u.slice(c.length);
 return '<a class="lnk" href="'+c+'" target="_blank" rel="noopener noreferrer">'+c+"</a>"+tail;});}
function driveId(u){var m=/\/file\/d\/([A-Za-z0-9_-]+)/.exec(u||"");return m?m[1]:"";}
function fileHtml(f){
 if(!f.path&&f.url)return driveHtml({name:f.name,size:f.size,url:f.url,mirror:f.mirror});
 if(!f.path)return '<span class="file dead">'+esc(f.name)+" — "+esc(f.skipped||"")+"</span>";
 if(isImage(f))return '<a href="'+encodeURI(f.path)+'" target="_blank">'+
  '<img loading="lazy" src="'+encodeURI(f.path)+'" alt="'+esc(f.name)+'"></a>';
 var lnk='<a class="file" href="'+encodeURI(f.path)+'" target="_blank">'+
  esc(f.name)+" ("+esc(f.size)+")</a>";
 // סרטון קטן מספיק נכנס כצרופה רגילה ויש לו path. בלי השורה הזאת הוא
 // היה מוצג כקישור להורדה בלבד, בעוד סרטון גדול יותר דווקא מתנגן.
 if(isVideo(f))return videoHtml([f.path],lnk);
 return lnk;}
function driveThumb(id){
 return "https://drive.google.com/thumbnail?id="+id+"&amp;sz=w1200";}
function isImageName(n){return /[.](jpe?g|png|gif|webp|bmp|heic)$/i.test(n||"");}
function driveHtml(d){var id=driveId(d.url);
 var cap=esc(d.name)+(d.size?" ("+esc(d.size)+")":"");
 var u=encodeURI(d.url);
 var lnk='<a class="file" href="'+u+'" target="_blank">'+cap+" — פתיחה בדרייב</a>";
 // עותק בריפו קודם לנגן של דרייב, שנכשל בהטמעה אצל רוב הצופים.
 if(d.mirror&&d.mirror.length)return videoHtml(d.mirror,lnk);
 if(!id)return '<a class="file" href="'+u+'" target="_blank">'+cap+"</a>";
 if(isImageName(d.name)||/^image\//.test(d.type||""))
  return '<div class="embed"><a href="'+u+'" target="_blank">'+
   '<img loading="lazy" src="'+driveThumb(id)+'" alt=""></a>'+lnk+"</div>";
 return '<div class="embed"><iframe loading="lazy" allow="autoplay" src="'+
  'https://drive.google.com/file/d/'+id+'/preview"></iframe>'+lnk+"</div>";}
// סרטון שמור בריפו. קובץ אחד מתנגן ישירות; כמה חלקים (סרטון גדול
// שפוצל כי Apps Script לא יכול לשלוח יותר מ-50MB בבקשה) נטענים בלחיצה
// ומחוברים בדפדפן — כך לא מורידים עשרות MB בכל כניסה לדף.
function videoHtml(parts,lnk){
 if(parts.length===1)return '<div class="embed"><video controls playsinline preload="metadata" src="'+
  encodeURI(parts[0])+'"></video>'+lnk+"</div>";
 return '<div class="embed"><button class="vload" data-parts="'+esc(parts.join("|"))+
  '">▶ צפייה בסרטון</button>'+lnk+"</div>";}
function loadParts(btn){if(btn.disabled)return;btn.disabled=true;
 var parts=btn.getAttribute("data-parts").split("|"),done=0;
 btn.textContent="טוען את הסרטון…";
 Promise.all(parts.map(function(p){return fetch(encodeURI(p)).then(function(r){
  if(!r.ok)throw new Error(r.status);return r.blob();}).then(function(b){
  done++;btn.textContent="טוען את הסרטון… "+done+"/"+parts.length;return b;});}))
 .then(function(bs){var v=document.createElement("video");
  v.controls=true;v.playsInline=true;
  v.src=URL.createObjectURL(new Blob(bs,{type:"video/mp4"}));
  btn.parentNode.replaceChild(v,btn);v.play().catch(function(){});})
 .catch(function(){btn.disabled=false;
  btn.textContent="הטעינה נכשלה — לחצו לנסות שוב";});}
function render(){
 var list=all.slice();
 if(senderFilter)list=list.filter(function(m){
  return (m.sender||"")===senderFilter;});
 if(starFilter)list=list.filter(function(m){return stars[m.id];});
 if(filter){var q=filter.toLowerCase();list=list.filter(function(m){
  return (m.text||"").toLowerCase().indexOf(q)>-1||
   (m.sender||"").toLowerCase().indexOf(q)>-1;});}
 list.sort(function(a,b){return a.ts-b.ts;});
 var html="",lastDay="";
 list.forEach(function(m){
  if(m.date!==lastDay){lastDay=m.date;
   html+='<div class="day"><span>'+esc(m.date)+"</span></div>";}
  html+='<div class="msg'+(stars[m.id]?" starred":"")+'" data-id="'+
   esc(m.id||"")+'" data-mo="'+
   esc(String(m.date||"").slice(0,7))+'">';
  html+='<div class="who">'+esc(m.sender)+"</div>";
  if(m.text)html+='<div class="txt">'+linkify(esc(m.text))+"</div>";
  var f=(m.files||[]).map(fileHtml);
  if(m.drive&&m.drive.url)f.push(driveHtml(m.drive));
  if(f.length)html+='<div class="files">'+f.join("")+"</div>";
  html+='<div class="when">'+esc(m.time)+
   (m.id?' <button class="star'+(stars[m.id]?" on":"")+'" title="הדגשה אישית">&#9733;</button>':"")+
   (DELURL&&m.id?' <button class="del" title="מחיקת ההודעה">&#10005;</button>':"")+
   "</div></div>";});
 feed.innerHTML=html;
 markHits(filter);
 [].forEach.call(feed.querySelectorAll(".day"),function(el){
  el.id="d-"+el.textContent.trim();});
 statusEl.textContent=list.length?"":
  (starFilter&&!starCount()?"עדיין לא הדגשת הודעות. לחצו על ★ ליד הודעה.":
  ((filter||senderFilter||starFilter)?"אין תוצאות.":"אין עדיין הודעות."));
 sub.textContent=(list.length!==all.length?list.length+" מתוך "+all.length:all.length)
  +" הודעות · "+loaded.length+" מתוך "+months.length+" חודשים";
 more.hidden=loaded.length>=months.length;
 buildNav(list);buildSenders();updateStarBtn();
 if(firstRender&&!filter&&list.length){firstRender=false;
  setTimeout(function(){
   window.scrollTo(0,document.documentElement.scrollHeight);},60);}}
// הדגשת מילות החיפוש. עובר על צמתי הטקסט בלבד (לא על מחרוזת ה-HTML),
// כדי שחיפוש כמו "amp" או "href" לא ישבור ישויות וקישורים.
function markHits(q){if(!q)return;q=q.toLowerCase();
 [].forEach.call(feed.querySelectorAll(".txt,.who"),function(box){
  var w=document.createTreeWalker(box,NodeFilter.SHOW_TEXT,null),nodes=[],n;
  while((n=w.nextNode()))nodes.push(n);
  nodes.forEach(function(t){var s=t.nodeValue,low=s.toLowerCase(),i=low.indexOf(q);
   if(i<0)return;var frag=document.createDocumentFragment(),p=0;
   while(i>-1){frag.appendChild(document.createTextNode(s.slice(p,i)));
    var mk=document.createElement("mark");mk.className="hit";
    mk.textContent=s.slice(i,i+q.length);frag.appendChild(mk);
    p=i+q.length;i=low.indexOf(q,p);}
   frag.appendChild(document.createTextNode(s.slice(p)));
   t.parentNode.replaceChild(frag,t);});});}
function starCount(){
 var n=0;all.forEach(function(m){if(stars[m.id])n++;});return n;}
function updateStarBtn(){
 starBtn.textContent=(starFilter?"★ ":"☆ ")+"מסומנות ("+starCount()+")";
 if(starFilter)starBtn.classList.add("on");
 else starBtn.classList.remove("on");}
function buildSenders(){
 var counts={};
 all.forEach(function(m){var s=m.sender||"";
  if(s)counts[s]=(counts[s]||0)+1;});
 var names=Object.keys(counts).sort(function(a,b){
  return counts[b]-counts[a]||a.localeCompare(b,"he");});
 if(senderFilter&&names.indexOf(senderFilter)<0)senderFilter="";
 var html='<option value="">כל השולחים ('+all.length+')</option>';
 names.forEach(function(n){
  html+='<option value="'+esc(n)+'">'+esc(n)+" ("+counts[n]+")</option>";});
 senderSel.innerHTML=html;
 senderSel.value=senderFilter;}
function buildNav(list){
 var byDate={};
 (list||all).forEach(function(m){byDate[m.date]=(byDate[m.date]||0)+1;});
 navList.innerHTML="";
 months.slice().sort().reverse().forEach(function(mo){
  var box=document.createElement("div");box.className="nav-mo";
  var b=document.createElement("button");b.className="nav-mo-btn";
  b.setAttribute("data-mo",mo);
  b.textContent=loaded.indexOf(mo)>-1?mo:mo+" — לחצו לטעינה";
  box.appendChild(b);
  var days=Object.keys(byDate).filter(function(d){return d.indexOf(mo)===0;})
   .sort().reverse();
  if(days.length){
   var ul=document.createElement("ul");ul.className="nav-days";
   days.forEach(function(d){
    var li=document.createElement("li");
    var db=document.createElement("button");db.className="nav-day";
    db.setAttribute("data-d",d);
    var s1=document.createElement("span");
    s1.textContent=d.slice(8)+"."+d.slice(5,7);
    var s2=document.createElement("span");s2.className="nav-n";
    s2.textContent=byDate[d];
    db.appendChild(s1);db.appendChild(s2);li.appendChild(db);ul.appendChild(li);});
   box.appendChild(ul);}
  navList.appendChild(box);});}
function toggleNav(on){
 var show=(on===undefined)?!navWrap.classList.contains("open"):on;
 if(show)navWrap.classList.add("open");else navWrap.classList.remove("open");}
document.getElementById("navbtn").addEventListener("click",function(){toggleNav();});
document.getElementById("navback").addEventListener("click",function(){toggleNav(false);});
navList.addEventListener("click",function(e){
 var t=e.target;
 var mb=t.closest?t.closest(".nav-mo-btn"):null;
 if(mb){var k=mb.getAttribute("data-mo");
  if(loaded.indexOf(k)<0){mb.disabled=true;loadOlder(k);}
  return;}
 var db=t.closest?t.closest(".nav-day"):null;
 if(db){var el=document.getElementById("d-"+db.getAttribute("data-d"));
  if(el){toggleNav(false);
   var hh=document.querySelector("header").offsetHeight+8;
   var y=el.getBoundingClientRect().top+window.pageYOffset-hh;
   window.scrollTo(0,y<0?0:y);
   setTimeout(function(){
    var y2=el.getBoundingClientRect().top+window.pageYOffset-hh;
    if(Math.abs(y2-window.pageYOffset)>4)window.scrollTo(0,y2<0?0:y2);},350);}}});
function loadOlder(mo,done){
 var h0=document.documentElement.scrollHeight,y0=window.pageYOffset;
 loadMonth(mo).then(function(){render();
  var h1=document.documentElement.scrollHeight;
  window.scrollTo(0,y0+(h1-h0));
  if(done)done();});}
function loadMonth(m){return fetch("data/"+m+".json?t="+Date.now())
 .then(function(r){return r.ok?r.json():{messages:[]};})
 .then(function(d){all=all.concat(d.messages||[]);loaded.push(m);});}
document.getElementById("search").addEventListener("input",function(e){
 filter=e.target.value.trim();render();});
senderSel.addEventListener("change",function(e){
 senderFilter=e.target.value;render();});
starBtn.addEventListener("click",function(){
 starFilter=!starFilter;render();});
feed.addEventListener("click",function(e){
 var vl=e.target.closest?e.target.closest(".vload"):null;
 if(vl){loadParts(vl);return;}
 var sb=e.target.closest?e.target.closest(".star"):null;
 if(sb){
  var sbox=sb.closest(".msg"),sid=sbox.getAttribute("data-id");
  if(!sid)return;
  if(stars[sid])delete stars[sid];else stars[sid]=1;
  saveStars();
  // כשהסינון פעיל ההודעה צריכה להיעלם, ולכן רינדור מלא.
  // אחרת די בהחלפת מחלקה — בלי הבהוב ובלי לאבד מיקום גלילה.
  if(starFilter){render();}
  else{sbox.classList.toggle("starred");
   sb.classList.toggle("on");updateStarBtn();}
  return;}
 var b=e.target.closest?e.target.closest(".del"):null;
 if(!b||!DELURL)return;
 var box=b.closest(".msg");
 var id=box.getAttribute("data-id"),mo=box.getAttribute("data-mo");
 if(!id||!mo)return;
 if(!confirm("למחוק את ההודעה הזאת מהארכיון? המחיקה היא לצמיתות, לכל מי שנכנס לדף."))return;
 var code=prompt("קוד מחיקה:");
 if(!code)return;
 b.disabled=true;b.textContent="…";
 fetch(DELURL,{method:"POST",
  headers:{"Content-Type":"text/plain;charset=utf-8"},
  body:JSON.stringify({code:code,id:id,month:mo})})
  .then(function(r){return r.json();})
  .then(function(d){
   if(d&&d.ok){all=all.filter(function(m){return m.id!==id;});render();}
   else{alert((d&&d.error)||"המחיקה נכשלה.");
    b.disabled=false;b.innerHTML="&#10005;";}})
  .catch(function(){alert("לא ניתן היה ליצור קשר עם שרת המחיקה.");
   b.disabled=false;b.innerHTML="&#10005;";});});
more.addEventListener("click",function(){
 var next=months[months.length-1-loaded.length];
 if(!next)return;more.disabled=true;
 loadOlder(next,function(){more.disabled=false;});});
fetch("data/index.json?t="+Date.now()).then(function(r){
 if(!r.ok)throw new Error("אין עדיין נתונים");return r.json();})
 .then(function(d){months=(d.months||[]).sort();
  if(!months.length){statusEl.textContent="אין עדיין הודעות.";return;}
  return loadMonth(months[months.length-1]).then(render);})
 .catch(function(){statusEl.textContent="הארכיון עדיין ריק. אחרי ההרצה הראשונה ההודעות יופיעו כאן.";});
</script>
</body>
</html>
